name: Bug Report
description: Report a bug or unexpected behaviour
title: '[Bug] '
labels: ['bug']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Description
        A clear description of the bug. What did you expect vs what happened?

  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: '1. 2. 3. ... Be specific.'
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, deployment target (Cloudflare/Node/Docker)
      placeholder: |
        - OS:
        - Node version:
        - Deployment:
        - Cadence version (or commit hash):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste any error output, stack traces, or console output.
      placeholder: |
        ```
        ```
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, workarounds tried, severity assessment.
    validations:
      required: false
