name: Question
description: Ask a question about Cadence
title: '[Question] '
labels: ['question']
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        ## Question

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What are you trying to do? What have you already tried?
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Details
      description: Version, deployment target, relevant config (no secrets).
    validations:
      required: false
